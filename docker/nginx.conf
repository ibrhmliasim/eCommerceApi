server {
    listen 80;
    server_name api.yourshop.test localhost;
    root /var/www/public;
    index index.php;

    # Стандартный Laravel front-controller роутинг
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Sanctum stateful auth зависит от корректных заголовков схемы/хоста,
        # особенно если позже добавите X-Forwarded-* за реальным прокси —
        # уже соответствует trustProxies из ADR-1.
        fastcgi_param HTTPS off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;
}